<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
<style>
.g { transform-box: fill-box; transform-origin: center }
.n1 { animation: n-arc 2.6s infinite }
.n2 { animation: n-arc2 2.6s infinite; animation-delay: -1.3s }
.n-slash { stroke-dasharray: 140; animation: n-slash 2.6s infinite }
@keyframes n-arc { 0% { transform: translate(30px, 130px) rotate(0); animation-timing-function: cubic-bezier(.2, .6, .4, 1) }
    50% { transform: translate(64px, 18px) rotate(160deg); animation-timing-function: cubic-bezier(.6, 0, .8, .4) }
    100% { transform: translate(98px, 130px) rotate(320deg) } }
@keyframes n-arc2 { 0% { transform: translate(160px, 130px) rotate(0); animation-timing-function: cubic-bezier(.2, .6, .4, 1) }
    50% { transform: translate(126px, 26px) rotate(-160deg); animation-timing-function: cubic-bezier(.6, 0, .8, .4) }
    100% { transform: translate(92px, 130px) rotate(-320deg) } }
@keyframes n-slash { 0%, 44% { stroke-dashoffset: 140; opacity: 1 } 52% { stroke-dashoffset: 0; opacity: 1 } 70%, 100% { stroke-dashoffset: 0; opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
