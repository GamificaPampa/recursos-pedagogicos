<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6cc4ff">
<title>Arcade do Código</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='14' y='20' width='72' height='60' rx='16' fill='%234da3ff' stroke='%231d2a44' stroke-width='6'/><circle cx='36' cy='48' r='9' fill='%23fff'/><circle cx='64' cy='48' r='9' fill='%23fff'/></svg>">
<style>@font-face { font-family: "Fredoka"; src: url("/identidade-visual/fontes/fredoka/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: swap }</style>
<link rel="stylesheet" href="estilo.css?v=8">
<style>
  .ouvir-grupo { display: flex; gap: 10px; justify-content: center; }
  #ht-card > .ouvir-grupo { justify-content: flex-end; margin: -6px -4px 4px 0; }
  #scr-end > .ouvir-grupo { margin: 0 0 8px; }
</style>
</head>
<body data-telao="sem-zoom">
<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <span class="bit b1">&lt;/&gt;</span><span class="bit b2">{ }</span><span class="bit b3">01</span><span class="bit b4">;</span><span class="bit b5">if</span><span class="bit b6">[ ]</span>
  <div class="hills"></div>
</div>

<div class="app">
  <!-- MENU -->
  <section class="menu" id="scr-menu">
    <h1 class="logo" data-ouvir="Arcade do Código"><span class="y">Arcade</span> do <span class="p">Código</span></h1>
    <div class="hero">
      <canvas id="mascot" role="button" tabindex="0" aria-label="Bit, o robô. Toque nele!"></canvas>
      <button type="button" class="bubble" id="bubble">Oi! Eu sou o Bit.</button>
    </div>
    <div class="progress">
      <span class="p-stars" id="p-stars">0/9</span>
      <div class="p-bar"><div id="p-fill"></div></div>
      <span class="p-title" id="p-title">Dev Iniciante</span>
    </div>
    <h2 class="sr-only">Jogos</h2>
    <div class="carousel" id="cards" data-ouvir-lista="Jogos"></div>
    <div class="dots" id="fases"></div>
    <button type="button" id="mute-menu" class="mute-menu">Som ligado</button>
  </section>

  <!-- JOGO -->
  <section class="game" id="scr-game" hidden>
    <div class="hud">
      <button type="button" id="btn-home" class="round" aria-label="Voltar ao menu" data-icone="casa"></button>
      <div class="hud-score"><small>PONTOS</small><b id="score">0</b></div>
      <div class="hud-title" id="hud-title"></div>
      <div class="hearts" id="hearts"></div>
      <button type="button" id="mute" class="round" aria-label="Ligar ou desligar som"></button>
      <div class="time" id="time"><div id="timefill"></div></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>

  <!-- FIM -->
  <section class="end" id="scr-end" hidden>
    <div class="ribbon" id="end-game"></div>
    <div class="end-head" id="end-head" data-ouvir>Tempo esgotado!</div>
    <div class="card result" id="end-card" data-ouvir>
      <div class="medal-wrap"><div class="rays"></div><div class="medal" id="medal"></div></div>
      <div class="end-stars" id="end-stars"><span data-icone="estrela"></span><span data-icone="estrela"></span><span data-icone="estrela"></span></div>
      <div class="big" id="final">0 pts</div>
      <div class="rank" id="rank"></div>
      <div class="new-star" id="new-star" hidden></div>
      <div class="stats" id="stats"></div>
      <div class="record" id="record"></div>
    </div>
    <div class="card send" id="send-card">
      <div class="send-title" id="send-title">Entre no placar da sala!</div>
      <form id="send-form" autocomplete="off">
        <div class="apelido" id="apelido-box">
          <span id="apelido-icone" aria-hidden="true"></span>
          <b id="apelido-texto">Seu apelido</b>
        </div>
        <div class="sala-row">
          <label for="sala">Código da sala</label>
          <input id="sala" name="sala" maxlength="4" placeholder="ABCD" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-describedby="send-note">
        </div>
        <div class="send-acoes">
          <button type="button" class="btn-sm sec" id="apelido-trocar" data-icone="repetir">Trocar</button>
          <button type="submit" class="btn-sm" id="send-btn">Enviar</button>
        </div>
      </form>
      <div class="send-note" id="send-note">Digite o código que aparece no telão da sala. Sem código, a jogada não vai para o placar.</div>
    </div>
    <div class="card fact" data-ouvir>
      <b id="learn-title">Você praticou</b><span id="learn"></span>
      <div class="real" id="real-wrap"><b data-icone="maleta">Na vida real</b><span id="real"></span></div>
    </div>
    <div class="end-actions">
      <button type="button" class="btn" id="btn-again" data-icone="repetir">Jogar de novo</button>
      <button type="button" class="btn ghost" id="btn-menu" data-icone="controle">Outros jogos</button>
    </div>
  </section>
</div>

<!-- COMO JOGAR -->
<div class="overlay" id="howto" hidden data-ouvir-sobre>
  <div class="ht-card" id="ht-card">
    <h2 id="ht-title"></h2>
    <div class="ht-concept" id="ht-concept"></div>
    <div class="ht-demo" id="ht-demo">
      <span class="ht-target" id="ht-target"></span>
      <span class="ht-hand" data-icone="toque"></span>
      <span class="ht-say" id="ht-say">Experimente aqui!</span>
    </div>
    <ul class="ht-steps" id="ht-steps"></ul>
    <div class="mode-box">
      <div class="mode-label">Escolha o nível</div>
      <div class="modes" id="modes" role="radiogroup" aria-label="Nível de dificuldade"></div>
      <div class="mode-hint" id="mode-hint"></div>
    </div>
    <button type="button" class="btn" id="ht-go" data-icone="play">Começar!</button>
    <button type="button" class="ht-back" id="ht-back">Escolher outro jogo</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script src="/identidade-visual/js/icones.js"></script>
<script src="/identidade-visual/js/jogo.js"></script>
<script src="nucleo.js?v=9"></script>
<script src="ninja.js?v=5"></script>
<script src="esteira.js?v=7"></script>
<script src="robo.js?v=5"></script>
<script>Arcade.boot();</script>
<script>
// Ouvir, do kit de jogo: lê o menu, o "como jogar" e o resultado. Jogo de reflexo: só as instruções e o resultado, sem as falas do Bit
(function () {
  if (!window.Jogo || !Jogo.ouvir) return;
  Jogo.ouvir.bit = false;
  var grupo = function (comSozinho) {
    var g = document.createElement('div');
    g.className = 'ouvir-grupo';
    g.append(Jogo.botao('ouvir'));
    if (comSozinho) g.append(Jogo.botao('ler-sozinho'));
    return g;
  };
  var topo = document.querySelector('.menu-topo');
  if (topo) { topo.insertBefore(grupo(true), topo.lastChild); topo.append(Jogo.botao('telao')); }
  document.getElementById('ht-card').prepend(grupo(true));
  document.getElementById('scr-end').prepend(grupo(false));
  // Cada jogo do menu é lido pelo título
  document.querySelectorAll('#cards .gcard').forEach(function (c) { c.dataset.ouvir = c.querySelector('h3').textContent; });
  var telas = ['scr-menu', 'scr-end', 'howto'].map(function (id) { return document.getElementById(id); });
  var ultima = '';
  new MutationObserver(function () {
    var agora = telas.map(function (e) { return e.hidden ? '0' : '1'; }).join('');
    if (agora === ultima) return;
    ultima = agora;
    if (agora.indexOf('1') >= 0) Jogo.ouvir.novaTela(); else Jogo.ouvir.parar();
  }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
})();
</script>
<script src="/identidade-visual/js/bit.js" data-canto="topo-direita" defer></script>
</body>
</html>
