<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
<style>
.g { transform-box: fill-box; transform-origin: center }
.a-hop { animation: d-hop 1.4s ease-in-out infinite }
.a-tw { animation: twinkle 1.8s ease-in-out infinite }
.a-tw2 { animation: twinkle 1.8s ease-in-out infinite; animation-delay: -.9s }
@keyframes d-hop { 0%, 60%, 100% { transform: translateY(0) } 30% { transform: translateY(-12px) } }
@keyframes twinkle { 50% { transform: scale(.6) rotate(30deg) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><symbol id="bot-art" viewBox="0 0 100 100">
