  </symbol></defs>
<rect x="32" y="76" width="44" height="40" rx="6" fill="#fff" stroke="#2f2a4a" stroke-width="4"/>
          <rect x="78" y="58" width="44" height="58" rx="6" fill="#ffd23f" stroke="#2f2a4a" stroke-width="4"/>
          <rect x="124" y="88" width="44" height="28" rx="6" fill="#fff" stroke="#2f2a4a" stroke-width="4"/>
