<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
<style>
.g { transform-box: fill-box; transform-origin: center }
.a-tw { animation: twinkle 1.8s ease-in-out infinite }
.a-tw2 { animation: twinkle 1.8s ease-in-out infinite; animation-delay: -.9s }
.m-fly { animation: m-fly 2.2s ease-in-out infinite }
.m-flame { transform-box: fill-box; transform-origin: 50% 0; animation: m-flame .25s ease-in-out infinite alternate }
@keyframes m-flame { to { transform: scaleY(.65) } }
@keyframes m-fly { 50% { transform: translateY(-8px) } }
@keyframes twinkle { 50% { transform: scale(.6) rotate(30deg) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><symbol id="star" viewBox="0 0 100 100">
    <polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38" fill="#ffd84d" stroke="#2f2a4a" stroke-width="5" stroke-linejoin="round"/>
  </symbol></defs>
<g class="g a-tw"><use href="#star" x="30" y="18" width="20" height="20"/></g>
          <g class="g a-tw2"><use href="#star" x="152" y="72" width="18" height="18"/></g>
          <text x="150" y="38" text-anchor="middle" font-family='Fredoka, "Trebuchet MS", "Arial Rounded MT Bold", sans-serif' font-weight="700" font-size="22" fill="#fff">{ }</text>
          <text x="46" y="96" text-anchor="middle" font-family='Fredoka, "Trebuchet MS", "Arial Rounded MT Bold", sans-serif' font-weight="700" font-size="20" fill="#fff">if</text>
          <g class="m-fly">
            <path class="m-flame" d="M91 86 Q100 116 109 86 Z" fill="#ff8a3d" stroke="#2f2a4a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M88 64 L72 88 L90 84 Z M112 64 L128 88 L110 84 Z" fill="#ff5f8f" stroke="#2f2a4a" stroke-width="4" stroke-linejoin="round"/>
            <path d="M100 10 C120 28 122 62 113 86 H87 C78 62 80 28 100 10 Z" fill="#fff" stroke="#2f2a4a" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="100" cy="44" r="10" fill="#4da3ff" stroke="#2f2a4a" stroke-width="4"/>
          </g>
</svg>
