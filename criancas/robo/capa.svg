<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
<style>
.g { transform-box: fill-box; transform-origin: center }
.r-walk { animation: r-walk 4.6s ease-in-out infinite }
.r-star { animation: r-star 4.6s ease-in-out infinite }
@keyframes r-star { 0%, 68%, 92%, 100% { transform: scale(1) rotate(0) } 76% { transform: scale(1.4) rotate(25deg) } 84% { transform: scale(.95) rotate(-8deg) } }
@keyframes r-walk { 0%, 8% { transform: translate(14px, 8px); opacity: 1 }
    28% { transform: translate(84px, 8px) }
    48% { transform: translate(84px, 60px) }
    70%, 88% { transform: translate(110px, 60px); opacity: 1 }
    93% { transform: translate(110px, 60px); opacity: 0 }
    94% { transform: translate(14px, 8px); opacity: 0 }
    100% { transform: translate(14px, 8px); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><symbol id="bot-art" viewBox="0 0 100 100">
    <line x1="50" y1="8" x2="50" y2="22" stroke="#2f2a4a" stroke-width="4"/>
    <circle cx="50" cy="8" r="6" fill="#ff4d4d"/>
    <rect x="18" y="22" width="64" height="48" rx="14" fill="#4da3ff" stroke="#2f2a4a" stroke-width="4"/>
    <circle cx="38" cy="44" r="9" fill="#fff"/><circle cx="62" cy="44" r="9" fill="#fff"/>
    <circle cx="40" cy="45" r="4" fill="#2f2a4a"/><circle cx="64" cy="45" r="4" fill="#2f2a4a"/>
    <circle cx="27" cy="57" r="4" fill="#ff8fb0"/><circle cx="73" cy="57" r="4" fill="#ff8fb0"/>
    <path d="M40 60 q10 7 20 0" stroke="#2f2a4a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="30" y="72" width="40" height="20" rx="6" fill="#8cc4ff" stroke="#2f2a4a" stroke-width="4"/>
  </symbol><symbol id="star" viewBox="0 0 100 100">
    <polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38" fill="#ffd84d" stroke="#2f2a4a" stroke-width="5" stroke-linejoin="round"/>
  </symbol></defs>
<path d="M37 31 H107 V83 H133" stroke="#fff" stroke-width="5" stroke-dasharray="1 10" stroke-linecap="round" fill="none" opacity=".85"/>
          <g class="g r-star"><use href="#star" x="134" y="58" width="48" height="48"/></g>
          <g class="r-walk"><use href="#bot-art" width="46" height="46"/></g>
</svg>
