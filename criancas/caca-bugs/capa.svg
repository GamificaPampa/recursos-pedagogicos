<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
<style>
.g { transform-box: fill-box; transform-origin: center }
.k-pop { animation: k-pop 2.4s ease-in-out infinite }
.k-pop2 { animation: k-pop 2.4s ease-in-out infinite; animation-delay: -1.2s }
.k-tap { animation: k-tap 2.4s ease-out infinite }
@keyframes k-pop { 0%, 10% { transform: scale(0) } 25%, 55% { transform: scale(1) } 62% { transform: scale(1.25) rotate(20deg) } 70%, 100% { transform: scale(0) } }
@keyframes k-tap { 0%, 55% { transform: scale(.4); opacity: 0 } 60% { opacity: 1 } 80%, 100% { transform: scale(1.5); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
