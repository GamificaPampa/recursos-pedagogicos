<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caça aos Bugs · Estande</title>
<style>@font-face { font-family: "Fredoka"; src: url("/identidade-visual/fontes/fredoka/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: swap }</style>
<style>
  /* layout: booth TV — title strip on top, QR card left, live top-10 scoreboard right */
  :root{ --ink:#2f2a4a; --soft:#6a6590; --orange:#ff8a3d; --orange-d:#e0661c; --pink:#ff5f8f; --yellow:#ffd23f; --mint:#4fd6a6; --purple:#8c73ff; --purple-d:#6a52e0;
         --font:'Fredoka', 'Comic Sans MS', 'Trebuchet MS', sans-serif; }
  *{ box-sizing:border-box; }
  html, body{ height:100%; margin:0; }
  body{ font-family:var(--font); color:var(--ink); overflow:hidden;
        background:linear-gradient(180deg, #6cc4ff 0%, #d2f1ff 75%); }
  .hills{ position:fixed; left:0; right:0; bottom:0; height:22%; z-index:0; }
  .hills::before, .hills::after{ content:''; position:absolute; bottom:-45%; border-radius:50%; }
  .hills::before{ left:-15%; width:80%; height:150%; background:#8ddf6a; }
  .hills::after{ right:-20%; width:85%; height:130%; background:#6cc653; }
  .cloud{ position:fixed; background:#fff; border-radius:999px; opacity:.9; z-index:0; }
  .cloud::before{ content:''; position:absolute; width:55%; height:160%; left:15%; bottom:20%; background:#fff; border-radius:50%; }
  .k1{ width:180px; height:50px; top:6%; left:4%; } .k2{ width:130px; height:38px; top:10%; right:38%; }

  .wrap{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; padding:2.5vh 3vw 3vh; gap:2vh; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:24px; }
  h1{ margin:0; font-size:clamp(2.4rem, 5.4vw, 5rem); line-height:.95; font-weight:700; color:#fff;
      -webkit-text-stroke:5px var(--ink); paint-order:stroke fill; text-shadow:0 7px 0 var(--ink); white-space:nowrap; }
  h1 .a{ color:var(--yellow); } h1 .b{ color:var(--pink); }
  .tagline{ background:#fff; border-radius:22px; padding:12px 20px; font-size:clamp(1rem, 1.5vw, 1.35rem); font-weight:500; line-height:1.3; box-shadow:0 6px 0 rgba(47,42,74,.12); max-width:34em; }

  main{ flex:1; min-height:0; display:grid; grid-template-columns:auto 1fr; gap:3vw; align-items:stretch; }

  .qr-col{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6vh; position:relative; }
  .qr{ background:#fff; border-radius:30px; padding:14px; width:min(26vw, 38vh); border:6px solid var(--purple); box-shadow:0 10px 0 var(--purple-d), 0 22px 40px rgba(47,42,74,.25); }
  .qr svg{ width:100%; height:auto; display:block; }
  .sala{ display:flex; flex-direction:column; align-items:center; gap:.2em; background:var(--yellow); border:5px solid var(--ink); border-radius:26px; padding:.5vh 1.6vw 1vh; box-shadow:0 8px 0 var(--ink); }
  .sala-rot{ font-weight:600; font-size:clamp(.95rem, 1.5vw, 1.4rem); }
  .sala-cod{ font-weight:700; font-size:clamp(2.6rem, min(6.4vw, 11vh), 6rem); line-height:1; letter-spacing:.16em; margin-right:-.16em; }
  .scan{ background:var(--orange); color:#fff; font-weight:700; font-size:clamp(1.1rem, 1.9vw, 1.8rem); padding:8px 26px; border-radius:999px; box-shadow:0 6px 0 var(--orange-d); }
  .url{ font-weight:600; font-size:.95rem; opacity:.7; }
  .bug{ position:absolute; width:clamp(60px, 7vw, 110px); animation:wig 1.6s ease-in-out infinite; }
  .bug svg{ width:100%; display:block; }
  .g1{ top:2%; left:-3%; } .g2{ bottom:12%; right:-4%; animation-delay:.6s; }
  @keyframes wig{ 50%{ transform:rotate(12deg) translateY(-8px); } }

  .board{ background:#fff; border-radius:30px; padding:2.2vh 2vw; display:flex; flex-direction:column; min-height:0; box-shadow:0 10px 0 rgba(47,42,74,.14); position:relative; }
  .board-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:1.4vh; }
  .board-head h2{ margin:0; font-size:clamp(1.5rem, 2.6vw, 2.4rem); font-weight:700; }
  .live{ display:flex; align-items:center; gap:8px; font-weight:600; color:var(--soft); font-size:clamp(.85rem, 1.1vw, 1.05rem); white-space:nowrap; }
  .live i{ width:12px; height:12px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 0 rgba(79,214,166,.6); animation:ping 1.8s infinite; }
  .live.off i{ background:var(--pink); animation:none; }
  @keyframes ping{ 70%{ box-shadow:0 0 0 10px rgba(79,214,166,0); } 100%{ box-shadow:0 0 0 0 rgba(79,214,166,0); } }

  ol{ list-style:none; margin:0; padding:0; flex:1; min-height:0; display:flex; flex-direction:column; gap:.9vh; }
  li{ display:grid; grid-template-columns:3.2em 1fr auto auto; align-items:center; gap:14px; background:#f3f8ff; border-radius:16px;
      padding:.8vh 16px; font-size:clamp(1rem, 1.9vw, 1.7rem); font-weight:600; flex:1; max-height:8vh; min-height:0; }
  li .pos{ font-weight:700; text-align:center; color:var(--soft); font-variant-numeric:tabular-nums; }
  li .name{ display:flex; align-items:center; gap:.3em; min-width:0; }
  li .nick{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .pts{ font-weight:700; color:var(--orange); font-variant-numeric:tabular-nums; }
  li.p1{ background:#fff4c2; } li.p2{ background:#eef0f7; } li.p3{ background:#ffe6d6; }
  li.p1 .pos, li.p2 .pos, li.p3 .pos{ font-size:1.25em; }
  li.new{ animation:flash 1.2s ease-out 3; }
  @keyframes flash{ 0%{ background:var(--mint); transform:scale(1.03); } 100%{} }
  li .del{ display:none; background:var(--pink); color:#fff; border:0; border-radius:10px; font:inherit; font-size:.8em; padding:2px 10px; cursor:pointer; }
  .admin li .del{ display:block; }
  .empty{ flex:1; display:grid; place-items:center; text-align:center; color:var(--soft); font-size:clamp(1.1rem, 2vw, 1.8rem); font-weight:600; }
  .count{ margin-top:1.2vh; color:var(--soft); font-weight:600; font-size:clamp(.9rem, 1.2vw, 1.15rem); text-align:right; }

  .leader{ position:absolute; left:50%; top:-22px; transform:translateX(-50%); background:var(--pink); color:#fff; font-weight:700;
           font-size:clamp(1.1rem, 2vw, 1.8rem); padding:8px 26px; border-radius:999px; box-shadow:0 6px 0 #d63f6f; white-space:nowrap; animation:pop .5s cubic-bezier(.3,1.6,.6,1); z-index:3; }
  @keyframes pop{ from{ transform:translateX(-50%) scale(.3); } }

  .gear{ position:fixed; right:12px; bottom:12px; z-index:5; width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.6); font-size:1.2rem; cursor:pointer; opacity:.5; }
  .gear:hover, .admin .gear{ opacity:1; }
  .admin-bar{ display:none; position:fixed; right:60px; bottom:12px; z-index:5; gap:8px; }
  .admin .admin-bar{ display:flex; }
  .admin-bar button{ border:0; border-radius:999px; font:inherit; font-weight:600; padding:8px 16px; cursor:pointer; background:var(--ink); color:#fff; }
  .admin-bar button.danger{ background:var(--pink); }
  .icone{ display:inline-block; width:1.15em; height:1.15em; vertical-align:-.22em; flex:none; }
  .gear .icone{ width:24px; height:24px; vertical-align:middle; }
  li .pos .icone{ width:1.4em; height:1.4em; }

  @media (max-width:900px){ body{ overflow:auto; } main{ grid-template-columns:1fr; } .qr{ width:min(80vw, 420px); } header{ flex-direction:column; align-items:flex-start; } h1{ white-space:normal; } li{ max-height:none; } .bug{ display:none; } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none!important; } }
</style>

      <div class="qr" id="qr"></div>

      <div class="board-head">

  </main>
</div>
<div class="admin-bar">
  <button type="button" id="btn-reset" class="danger">Nova sala</button>

    });
    var na = ver === 1 ? 0 : Math.floor(ver / 7) + 2, pos = [6];
    if(na){ var passo = Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2; for(var q = n - 7; pos.length < na; q -= passo) pos.splice(1, 0, q); }

    function formato(m){
      var dd = m, r = dd; for(var t = 0; t < 10; t++) r = (r << 1) ^ ((r >>> 9) * 0x537);

    for(var m = 0; m < 8; m++){
      if(forcarMascara != null && m !== forcarMascara) continue;
      formato(m);
      var g = mod.map(function(l, yy){ return l.map(function(v, xx){ return fn[yy][xx] ? v : v !== mascara(m, xx, yy); }); });
      var sc = nota(g);
      if(sc < nm){ nm = sc; melhor = g; }
    }
    return melhor;
  }

  function salaValida(v){ return typeof v === 'string' && /^[BCDFGHJKMNPRSTVXZ]{4}$/.test(v); }
  function sorteiaSala(){
    var v = '', r = new Uint32Array(4);
    try{ crypto.getRandomValues(r); }catch(e){ for(var j = 0; j < 4; j++) r[j] = Math.floor(Math.random() * 4294967296); }
    for(var i = 0; i < 4; i++) v += LETRAS.charAt(r[i] % LETRAS.length);
    return v;
  }
  function feed(){ return FEED_BASE + '-' + sala; }

  var entries = load(K_ENTRIES, {});
  var hidden = load(K_HIDDEN, {});
  var resetAt = load(K_RESET, 0);
  var since = load(K_SINCE, 'all');
  var sala = load(K_SALA, '');
  var leaderKey = null;

  // Sala nova: código novo, canal novo e placar vazio neste telão
  function comecarSala(){
    sala = sorteiaSala();
    entries = {}; hidden = {}; since = 'all'; resetAt = 0;
    save(K_SALA, sala); save(K_ENTRIES, entries); save(K_HIDDEN, hidden); save(K_SINCE, since); save(K_RESET, resetAt);
  }
  if(!salaValida(sala)) comecarSala();

  function desenharSala(){
    document.getElementById('sala-cod').textContent = sala;
    var g = qrMatriz(ENDERECO + '?sala=' + sala), box = document.getElementById('qr');
    if(!g){ box.hidden = true; return; }
    var n = g.length, b = 2, d = '';
    for(var y = 0; y < n; y++) for(var x = 0; x < n; x++) if(g[y][x]) d += 'M' + (x + b) + ' ' + (y + b) + 'h1v1h-1z';
    var t = n + 2 * b;
    box.hidden = false;
    box.innerHTML = '<svg viewBox="0 0 ' + t + ' ' + t + '" shape-rendering="crispEdges" role="img" aria-label="QR code para entrar na sala ' + sala + '"><path d="' + d + '" fill="#000"/></svg>';
  }

  // Pedido ao placar com limite de 8 s
  async function buscar(url, opcoes){
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 8000);
    try{
      opcoes = opcoes || {}; opcoes.signal = ctl.signal;
      var res = await fetch(url, opcoes), texto = await res.text();
      return { ok:res.ok, status:res.status, texto:texto };
    }finally{ clearTimeout(t); }
  }

  function ranked(){
    return Object.keys(entries)
      .filter(function(k){ return !hidden[k]; })
      .map(function(k){ var e = entries[k]; return { k:k, n:e.n, s:e.s, t:e.t }; })
      .sort(function(a, b){ return b.s - a.s || a.t - b.t; });
  }

  function render(fresh){
    fresh = fresh || [];
    var list = document.getElementById('list');
    var all = ranked();
    list.innerHTML = '';
    if(!all.length){
      list.innerHTML = '<div class="empty"><span>Ninguém jogou ainda.<br>Seja o primeiro! ' + icon('bug') + '</span></div>';
    }
    all.slice(0, TOP).forEach(function(e, i){
      var li = document.createElement('li');
      li.className = (i < 3 ? 'p' + (i + 1) : '') + (fresh.indexOf(e.k) >= 0 ? ' new' : '');
      var pos = document.createElement('span'); pos.className = 'pos'; if(i < 3) pos.innerHTML = icon(['ouro', 'prata', 'bronze'][i]); else pos.textContent = (i + 1) + 'º';
      var name = document.createElement('span'); name.className = 'name';
      var nick = document.createElement('span'); nick.className = 'nick'; nick.textContent = e.n;
      var bicho = BICHOS[e.n.split(' ')[0]];
      name.insertAdjacentHTML('afterbegin', bicho ? icon(bicho) : '<span class="icone" aria-hidden="true"></span>'); // sem ícone do bicho, deixa o espaço para alinhar
      name.appendChild(nick);
      var pts = document.createElement('span'); pts.className = 'pts'; pts.textContent = e.s + ' pts';
      var del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = 'remover';
      del.addEventListener('click', function(){ hidden[e.k] = 1; save(K_HIDDEN, hidden); render(); });
      li.appendChild(pos); li.appendChild(name); li.appendChild(pts); li.appendChild(del);
      list.appendChild(li);
    });
    var n = all.length;
    document.getElementById('count').textContent = n ? (n + (n === 1 ? ' jogada no placar' : ' jogadas no placar')) : '';

    var top = all[0];
    if(top && fresh.indexOf(top.k) >= 0 && top.k !== leaderKey && leaderKey !== null){
      announce('Novo líder: ' + top.n + '!');
    }
    leaderKey = top ? top.k : '';
  }

  function announce(text){
    var old = document.querySelector('.leader'); if(old) old.remove();
    var b = document.createElement('div'); b.className = 'leader'; withIcon(b, 'festa', text);
    document.getElementById('board').appendChild(b);
    setTimeout(function(){ b.remove(); }, 5000);
  }

  function setLive(ok){
    document.getElementById('live').classList.toggle('off', !ok);
    document.getElementById('live-t').textContent = ok ? 'ao vivo' : 'sem internet';
  }

  async function poll(){
    var daSala = sala;
    try{
      var res = await buscar(feed() + '/json?poll=1&since=' + encodeURIComponent(since), { cache:'no-store' });
      if(daSala !== sala) return; // a sala mudou enquanto o pedido ia: a resposta é do canal antigo
      if(!res.ok) throw new Error('status ' + res.status);
      var fresh = [];
      res.texto.split('\n').forEach(function(line){
        if(!line) return;
        try{
          var m = JSON.parse(line);
          if(m.event !== 'message') return;
          since = m.id;
          if(m.time < resetAt) return;
          var d = JSON.parse(m.message);
          if(!d || typeof d.k !== 'string' || typeof d.n !== 'string' || typeof d.s !== 'number') return;
          if(!APELIDO.test(d.n)) return;
          if(d.s % 1 !== 0 || d.s < 1 || d.s > MAX_SCORE) return;
          // Cada bug vale no máximo 35 pontos: se vier a contagem de bugs, ela tem de bater com a pontuação
          if(typeof d.h === 'number' && (d.h % 1 !== 0 || d.h < 1 || d.h > MAX_HITS || d.s > d.h * 35)) return;
          var k = d.k.slice(0, 40);
          if(!entries[k]){ entries[k] = { n:d.n, s:d.s, t:m.time }; fresh.push(k); }
        }catch(e){}
      });
      save(K_SINCE, since);
      if(fresh.length){ save(K_ENTRIES, entries); render(fresh); }
      setLive(true);
    }catch(err){
      if(daSala === sala) setLive(false);
    }finally{
      setTimeout(poll, POLL_MS);
    }
  }

  document.getElementById('gear').addEventListener('click', function(){ document.body.classList.toggle('admin'); });
  document.getElementById('btn-done').addEventListener('click', function(){ document.body.classList.remove('admin'); });
  document.getElementById('btn-reset').addEventListener('click', function(){
    if(!window.confirm('Começar uma sala nova? O código muda, o placar atual sai deste telão e a turma precisa digitar o código novo.')) return;
    comecarSala();
    desenharSala();
    leaderKey = '';
    render();
  });

  desenharSala();
  render();
  leaderKey = (ranked()[0] || {}).k || '';
  poll();
})();
</script>
</body>
</html>
