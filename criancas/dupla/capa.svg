<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
<style>
.g { transform-box: fill-box; transform-origin: center }
.d-hop { animation: d-hop 1s ease-in-out infinite }
.d-arrow { animation: d-arrow 4s steps(1, end) infinite }
@keyframes d-arrow { 0% { transform: rotate(0) } 25% { transform: rotate(90deg) } 50% { transform: rotate(0) } 75% { transform: rotate(-90deg) } }
@keyframes d-hop { 0%, 60%, 100% { transform: translateY(0) } 30% { transform: translateY(-12px) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
